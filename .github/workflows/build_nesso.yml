name: Build Nesso
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Nesso
        run: pio run -e arduino-nesso-n1

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-nesso
          path: .pio/build/arduino-nesso-n1/
